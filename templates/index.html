<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Копилка Доченьки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(#81D4FA, #B2EBF2);
            min-height: 100vh;
            padding: 12px;
            position: relative;
            overflow: hidden;
        }

        .admin-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            z-index: 10;
            text-decoration: none;
        }

        /* Кнопка +100 — серая по умолчанию */
        .plus-btn {
            background: #9E9E9E;
            color: white;
            font-size: 42px;
            font-weight: 700;
            padding: 22px;
            border-radius: 35px;
            text-align: center;
            margin: 50px 0 15px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            cursor: not-allowed;
            transition: all 0.25s ease;
        }
        .plus-btn.active {
            background: linear-gradient(135deg, #8A2BE2, #BA55D3);
            cursor: pointer;
        }
        .plus-btn:active {
            transform: scale(0.92);
        }

        .parents {
            background: rgba(255,255,255,0.97);
            padding: 16px 20px;
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            margin: 12px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .balance-card {
            background: white;
            border-radius: 28px;
            padding: 28px 20px 24px;
            text-align: center;
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
            margin: 18px 0;
            position: relative;
            overflow: hidden;
        }
        .balance-card::before {
            content: "🦄 🌈 🐴 ✨ 🌟 🐎 🌸 🦋 ⭐ 💖";
            position: absolute;
            font-size: 29px;
            opacity: 0.14;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            line-height: 1.5;
            pointer-events: none;
            z-index: 1;
        }

        .balance { 
            font-size: 68px; 
            font-weight: 700; 
            color: #1e3a8a; 
            transition: transform 0.4s ease;
            position: relative; 
            z-index: 2; 
        }
        .available { 
            font-size: 23px; 
            font-weight: 700; 
            color: #1e3a8a; 
            letter-spacing: 2px; 
            margin-top: 6px; 
            position: relative; 
            z-index: 2; 
        }

        .btn-container { display: flex; gap: 14px; margin-top: 10px; }
        .btn-green, .btn-red {
            flex: 1;
            padding: 22px 12px;
            border-radius: 22px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
            text-align: center;
            transition: all 0.2s ease;
        }
        .btn-green:active, .btn-red:active {
            transform: scale(0.93);
        }
        .btn-green { background: linear-gradient(135deg, #4CAF50, #66BB6A); }
        .btn-red  { background: linear-gradient(135deg, #FF5252, #FF6E6E); }
    </style>
</head>
<body>

    <a href="/login" class="admin-btn">👨‍💼 Админ</a>

    <div class="container">

        <div id="plusBtn" class="plus-btn" onclick="submitForm('add100')">
            +100 ₽
        </div>

        <div class="parents">
            <label style="font-size:17px; font-weight:600; color:#FF69B4;">
                <input type="checkbox" id="mom" onchange="checkApproval()" style="transform:scale(1.4); margin-right:8px;"> Мама
            </label>
            <label style="font-size:17px; font-weight:600; color:#4FC3F7;">
                <input type="checkbox" id="dad" onchange="checkApproval()" style="transform:scale(1.4); margin-right:8px;"> Папа
            </label>
        </div>

        <div class="balance-card">
            <div id="balanceText" class="balance">{{ balance }} ₽</div>
            <p class="available">ДОСТУПНО</p>
        </div>

        <div class="btn-container">
            <div class="btn-green" onclick="submitForm('minus50')">
                -50 ₽<br><small>Я сама отдала</small>
            </div>
            <div class="btn-red" onclick="submitForm('minus100')">
                -100 ₽<br><small>Наказание</small>
            </div>
        </div>

    </div>

    <!-- Звуки -->
    <audio id="soundPlus" src="https://www.soundjay.com/buttons/beep-07.mp3"></audio>
    <audio id="soundMinus50" src="https://www.soundjay.com/buttons/button-09.mp3"></audio>
    <audio id="soundMinus100" src="https://www.soundjay.com/buttons/beep-08.mp3"></audio>

    <form id="actionForm" method="POST" style="display:none;">
        <input type="hidden" name="action" id="actionInput">
    </form>

    <script>
        const soundPlus = document.getElementById('soundPlus');
        const soundMinus50 = document.getElementById('soundMinus50');
        const soundMinus100 = document.getElementById('soundMinus100');
        const balanceText = document.getElementById('balanceText');

        function checkApproval() {
            const mom = document.getElementById('mom').checked;
            const dad = document.getElementById('dad').checked;
            const btn = document.getElementById('plusBtn');
            if (mom && dad) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function submitForm(action) {
            const btn = document.getElementById('plusBtn');
            if (action === 'add100' && !btn.classList.contains('active')) {
                alert("❌ Нужно согласие Мамы и Папы!");
                return;
            }

            // Звуки
            if (action === 'add100') soundPlus.play();
            else if (action === 'minus50') soundMinus50.play();
            else if (action === 'minus100') soundMinus100.play();

            // Анимация прыжка баланса
            balanceText.style.transform = 'scale(1.15)';
            setTimeout(() => {
                balanceText.style.transform = 'scale(1)';
            }, 150);

            document.getElementById('actionInput').value = action;
            document.getElementById('actionForm').submit();
        }
    </script>
</body>
</html>
